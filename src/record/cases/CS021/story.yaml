headline: An AI that flagged chest X-rays sped up reports, not lung cancer diagnosis
dek: In a randomized trial across five NHS trusts in England, an AI tool moved chest X-rays it judged
  abnormal to the front of the reporting queue. Reports came back sooner. Patients did not get a CT scan
  or a lung cancer diagnosis any sooner.
dek_rows:
- F001
- F048
- F023
- F013
- F016
grade:
  letter: B
  plain: Good evidence
  explain: A randomized trial, registered before it began and reported in a peer-reviewed journal. That
    starts at B. It would reach A with a clean match against the trial's registry record, not yet checked,
    or a second independent examination.
  rows:
  - F119
  - F121
  - F001
short_version:
- text: Between July 2023 and December 2024, five NHS trusts in England took part in a trial covering
    97,731 chest X-rays requested by GPs.
  rows:
  - F001
  - F071
- text: On days chosen at random, an AI tool, qXR from Qure.ai, sent a notice to the reporting list for
    each X-ray it judged abnormal, so it could be reported first. On the other days the AI still marked
    up every X-ray, but nothing was moved up the list.
  rows:
  - F074
  - F031
  - F048
  - F083
- text: 'On the AI days, X-rays were reported sooner: a median of 34.1 hours, against 47.0 hours on the
    other days.'
  rows:
  - F023
- text: Patients did not get a CT scan or a lung cancer diagnosis any sooner. The median time from X-ray
    to CT scan was 53 days either way.
  rows:
  - F013
  - F016
  - F009
- text: The investigators conclude that X-ray AI should not include this kind of prioritization in this
    setting.
  rows:
  - F125
