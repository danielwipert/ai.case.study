  - F121
  - F001
short_version:
- text: Between July 2023 and December 2024, five NHS trusts in England took part in a trial of chest
    X-rays requested by GPs. Of 97,731 X-rays taken, 93,326 were analysed.
  rows:
  - F001
  - F003
  - F070
  - F071
  - F113
- text: On days chosen at random, an AI tool, qXR from Qure.ai, sent a notice to the reporting list for
    each X-ray it judged abnormal, so it could be reported first. On the other days the AI still marked
    up the X-rays, but sent no notice. On both kinds of day, staff could still review an X-ray straight
    away under local procedure.
  rows:
  - F074
  - F031
  - F048
  - F083
  - F084
- text: 'On the AI days, X-rays were reported sooner: a median of 34.1 hours, against 47.0 hours on the
    other days.'
  rows:
  - F023
- text: The trial found no significant difference in how soon patients got a CT scan or a lung cancer
    diagnosis. The median time from X-ray to CT scan was 53 days either way.
  rows:
  - F013
  - F016
  - F009
- text: The investigators conclude that X-ray AI should not include this kind of prioritization in this
    setting.
  rows:
  - F125
