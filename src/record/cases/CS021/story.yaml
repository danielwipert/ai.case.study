disagreements_title: Where the paper disagrees with itself
disagreements_lede: In a few places the trial report says two different things about the same matter.
  We show both and don't pick one.
disagreements:
- title: Did any quarter show a difference?
  sides:
  - who: The paper's text
    says: No statistically significant difference for either main outcome in any quarter.
    rows:
    - F017
  - who: Its Extended Data Table 2
    says: Time to CT scan differed in the third quarter of 2024 (P = 0.03).
    rows:
    - F019
- title: Did any secondary outcome differ?
  sides:
  - who: The paper's text
    says: No differences in secondary outcomes by AI group.
    rows:
    - F022
  - who: Its Table 2
    says: Time to an X-ray report, listed as a secondary outcome, was shorter on AI days (P < 0.001).
    rows:
    - F023
- title: What was randomized?
  sides:
  - who: The Methods, in one place
    says: Participants were randomized in blocks, by day and site.
    rows:
    - F074
  - who: The Methods, elsewhere
    says: Individual patients were not randomized; their X-rays were.
    rows:
    - F077
what_they_say:
- who: The investigators
  quote: AI prioritization of CXR requested by UK primary care has no significant impact on the lung cancer
    pathway.
  rows:
  - F124
- who: The investigators
  quote: Therefore, CXR AI deployments should not include worklist prioritization in this context.
  rows:
  - F125
- who: The investigators
  quote: A limitation is the use of a single AI product, which will inevitably have different performance
    characteristics from others.
  rows:
  - F140
