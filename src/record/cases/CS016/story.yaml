short_version:
- text: Damien Charlotin keeps a database of court and tribunal decisions which, he says, covers only
    cases where the court found or implied that a party relied on hallucinated content. As downloaded
    on 10 October 2026 it lists 2,185 decisions, the oldest from April 2023.
  rows:
  - F022
  - F027
- text: More than half of the entries list a self-represented litigant as the party involved; 865 list
    a lawyer, and 32 list a judge.
  rows:
  - F027
  - F028
  - F029
- text: Only 234 entries name a specific tool. Most say the tool is "Implied" or "Unidentified", and the
    database itself warns that naming a tool does not necessarily mean that tool was responsible.
  rows:
  - F030
  - F039
- text: 'In Nebraska, a lawyer whose brief cited a case that does not exist said he did not rely on AI.
    The state''s Supreme Court did not decide whether he had: it struck the brief, dismissed the appeal
    and referred him for discipline, saying its analysis was the same either way.'
  rows:
  - F004
  - F006
  - F008
  - F011
- text: In New Mexico, the state's Supreme Court records that a lawyer admitted using ChatGPT for a brief
    with invented witnesses and testimony. The court held him in contempt, ordered him to pay $5,000 and
    referred him for discipline.
  rows:
  - F014
  - F015
  - F019
  - F020
