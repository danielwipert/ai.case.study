- code: CS016.F002
  kind: statement
  heading: 5
  statement: The Nebraska Supreme Court says it moved the appeal in Prososki v. Regan to its own docket
    to address numerous nonexistent or inaccurate case citations and quotations in the appellant's brief,
    which the appellee asserted were the product of generative AI.
  speaker: the court (Nebraska Supreme Court, per curiam)
