charter:
  event: 'Court and tribunal decisions addressing filings that relied on fabricated or misrepresented
    material (invented cases, quotations, holdings or evidence, and real authority misstated), as recorded
    in Damien Charlotin''s AI Hallucination Cases Database up to the cutoff; and two state supreme court
    decisions read in full: Prososki v. Regan, 321 Neb. 38 (Nebraska Supreme Court, filed 20 March 2026),
    and the dispositional order of direct contempt in State v. Sandoval, No. S-1-SC-40845 (Supreme Court
    of New Mexico; heard 21 August 2026; filing date unknown).'
  actors:
  - Damien Charlotin (HEC Paris), compiler of the database, and the coding choices he states on its face
  - The courts and tribunals whose decisions the database records, as the database codes them
  - The Nebraska Supreme Court, and the appellant's lawyer in Prososki v. Regan (not named)
  - The Supreme Court of New Mexico, and the appellant's lawyer it held in contempt (lawyers are not named)
  - Norton Rose Fulbright, as a commentator only
  place_and_period: 'Worldwide, as the database records it; the database begins on 14 April 2023 (per
    the legacy page, to be confirmed from the capture). The two decisions: Nebraska and New Mexico, 2026.'
  exclusions:
  - 'Whether a given filing was in fact produced by AI, beyond what the court found or the party admitted:
    the Record states what each decision establishes, implies or leaves open.'
  - Decisions not in the database at the cutoff, and the six federal decisions Norton Rose reads, except
    as Norton Rose reports them.
  - Court rules and standing orders on AI use, unless a captured decision applies one.
  evidence_cutoff: '2026-10-10'
  selection_reason: Proposition P6 (as the order was set before the propositions were withdrawn), and
    a large, independently compiled record of how courts establish, or fail to establish, the cause of
    confidently wrong work product.
  stopping_rule: The database page and its CSV as of the cutoff; the two supreme court decisions in full;
    Norton Rose Fulbright's 2026 update. No further searches.
