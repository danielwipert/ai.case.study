- title: How it was reported
  part: 3
  paras:
  - text: Fortune's 18 August report drew on a briefing by OpenAI, including its chief scientist, and
      Business Insider's account relays Brockman's own interviews. No OpenAI document in the record names
      an outside examiner of the September incident, the September pause or the restart; the only outside
      parties it names are cloud partners who helped supervise its red-teaming.
    rows:
    - F001
    - F047
    - F049
    - F033
  - text: In places the reports' wording differs from OpenAI's own. Fortune wrote that the new procedures
      call for teams to immediately pause a run if they cannot determine within 30 minutes that the alert
      is a false alarm; OpenAI's post says they are expected to pause. Fortune also reported the monitoring
      cost as a 20% compute burden on aspects of training, where OpenAI's post puts it at roughly 20%
      of the inference computing monitored.
    rows:
    - F098
    - F072
    - F075
    - F074
  - text: Fortune wrote that OpenAI had determined Astra presented a Critical cybersecurity risk; OpenAI's
      post says Astra may have critical cyber capabilities, on preliminary evidence. Fortune called August
      the first time OpenAI had paused aspects of AI development over safety, while OpenAI's own post
      describes an earlier pause of research-cluster inference right after the Hugging Face incident.
    rows:
    - F077
    - F076
    - F084
    - F085
  - text: Even OpenAI's accounts differ in tense. Its post on X says it "temporarily paused" training
      "for two weeks"; Sam Altman's post the same day says "We have paused some frontier RL training".
    rows:
    - F086
    - F087
  - text: One later report differs on the incident itself. Decrypt dated the Hugging Face incident to
      May, including in its report of what Brockman told Odd Lots; Fortune and OpenAI place it in July,
      and the Odd Lots transcript gives no month. Decrypt also says the agent spent two and a half days
      inside Hugging Face's systems, a figure this case does not test.
    rows:
    - F088
    - F089
