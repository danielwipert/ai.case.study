- title: What OpenAI says now
  part: 3
  disagreements:
  - 2
  paras:
  - text: On 23 October OpenAI wrote that its investments in securing its research environments "have
      allowed us to detect and stop sophisticated misaligned behavior before it causes damage", giving
      20 September as its example.
    rows:
    - F078
  - text: That post does not describe the 3 and 6 October incidents. It links to OpenAI's index of misalignment
      reports, which lists them, as other examples of misalignment OpenAI has observed.
    rows:
    - F092
  - text: As captured on 28 October, that index lists 20 reports. Seventeen describe incidents dated before
      OpenAI announced the August pause; none of the 20 was first posted before 16 September.
    rows:
    - F012
    - F013
  - text: OpenAI called the 20 September incident a lot less severe than some earlier ones, and the first
      since its hardening after Hugging Face.
    rows:
    - F066
