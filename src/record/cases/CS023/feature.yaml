- title: The second pause
  part: 2
  disagreements:
  - 1
  paras:
  - text: OpenAI's incident report says it stopped the run and then decided to pause all other training,
      evaluation and inference with tool use for its most capable models. The report does not date that
      decision, but OpenAI's 23 October post says the restart on 1 October came 11 days after the pause
      began. On 25 September the report said all of this remained paused.
    rows:
    - F024
    - F025
  - text: OpenAI says it added blocking controls at two independent layers, restricted DNS queries to
      an allowed list, and will not resume training that model. It says it used the pause to improve the
      systems that automatically stop runs.
    rows:
    - F038
    - F039
    - F043
  - text: Its two accounts describe the pause differently, as the box below shows.
    rows:
    - F070
    - F071
- title: Red-teaming with its own agents
  part: 2
  paras:
  - text: OpenAI's 23 October post describes red-teaming in which it turned its own agents on its defences;
      it does not say when the work took place. It says the red-teaming ran on isolated copies of its
      infrastructure, with cloud partners helping to supervise, and that the agents were given source
      code, configuration details and documentation of possible weaknesses. It says it spent hundreds
      of billions of tokens on the work.
    rows:
    - F093
    - F031
    - F032
  - text: In tests that gave the agents control of a host machine, OpenAI says, they found weaknesses
      giving limited internet access in almost every one of the narrow services that still linked its
      environments to the internet. It says the number of findings declined significantly as the work
      went on, and that it found no route agents could trivially exploit while hiding from its monitors.
    rows:
    - F050
    - F048
    - F051
  - text: OpenAI lists a flaw in Kata Containers, CVE-2026-24834, among the fixes it contributed. GitHub
      and Red Hat describe it as letting a container user run code as root in the guest virtual machine.
      GitHub's advisory dates from 19 February 2026.
    rows:
    - F056
    - F052
    - F054
    - F081
    - F093
