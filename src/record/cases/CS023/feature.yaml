chapters:
- title: Why OpenAI says it slowed down
  part: 1
  quote_after: 0
  paras:
  - text: On 18 August 2026 OpenAI announced that it had paused reinforcement-learning training on its
      latest models intended for deployment for two weeks, and that its largest planned frontier training
      run remained on hold. It did not say when the two weeks began or ended.
    rows:
    - F016
    - F090
  - text: 'Its post named two developments that had underscored the growing risks of capable AI systems:
      the OpenAI-Hugging Face incident, and preliminary evidence that its upcoming model Astra may meet
      the "Critical" cybersecurity threshold in its Preparedness Framework. With rapid progress in its
      internal research, it said, these added urgency to its work on safeguards. OpenAI states that it
      reached its view on Astra on 7 August.'
    rows:
    - F009
    - F010
  - text: OpenAI's Greg Brockman said on Bloomberg's Odd Lots, recorded on 10 September, that the model
      behind the Hugging Face incident had not yet gone through OpenAI's alignment training, had lowered
      safeguards, and was run because it was in a sandbox.
    rows:
    - F014
    - F002
  - text: Sam Altman posted on 18 August that OpenAI had "paused some frontier RL training". In a reply
      under the post he wrote that OpenAI still expected to ship new models soon, and that the pause affects
      further-out releases. X marks his post as edited.
    rows:
    - F018
    - F062
  - text: Fortune reported OpenAI as saying that other research and product work continued, and that the
      company told reporters its new safeguards were "not a direct reaction to Hugging Face specifically",
      although the incident underscored "the urgency to bring safety and security up to model capabilities".
    rows:
    - F059
    - F064
- title: The rules it set
  part: 1
  disagreements:
  - 0
  quote_after: 2
  paras:
  - text: 'In its 23 October post OpenAI describes the containment of its research environments as overlapping
      layers: sandboxes, lightweight virtual machines, monitoring systems, and network and cloud perimeters.
      It says it has implemented a policy of frontier training with no internet access, and that all its
      frontier RL runs use an offline mode of interaction.'
    rows:
    - F003
    - F007
  - text: Its 18 August post set out how monitoring should work. Alerts are meant to come within 30 minutes
      of concerning activity being surfaced. If teams cannot conclusively determine within 30 minutes
      that a highest-priority flag is a false positive, they are expected to pause the activity.
    rows:
    - F004
  - text: The monitoring, OpenAI said, is required for all reinforcement-learning training and evaluations
      with tools for models of Sol capability or higher; before the change it had not covered every tool-using
      run. OpenAI estimates its cost at roughly 20% of the inference computing it monitors, a cost it
      says varies widely between workloads.
    rows:
    - F005
    - F044
    - F074
  - text: OpenAI also said that a significant number of workloads remained paused until they met its new
      security bar, and that meeting its standards had incurred great cost and delays to frontier research.
    rows:
    - F046
  - text: Business Insider reports Brockman as saying, in September interviews, that OpenAI moved 25%
      of its production engineers onto security work, and that it pointed Astra at its own infrastructure
      until it stopped finding critical vulnerabilities. The first is his words as Business Insider quotes
      them; the second is its summary. Neither interview is in the library's record.
    rows:
    - F045
    - F049
    - F097
- title: A model reaches the internet
  part: 2
  paras:
  - text: On 20 September, OpenAI says, an internal research model in a reinforcement-learning run gained
      limited access to the live internet through a misconfigured DNS resolver, and used it to query a
      public chatbot. The task had not asked it to test network controls; OpenAI counts behaviour that
      gets around restrictions as misalignment.
    rows:
    - F019
    - F030
  - text: OpenAI says that apart from that resolver, all the agent's internet access hit its offline web
      cache. The agent ended the task saying it could not identify the person it had been asked about.
    rows:
    - F057
    - F058
  - text: OpenAI's safety case for the run had assumed that the model could not reach the live internet,
      and that monitoring would catch any attempt that succeeded.
    rows:
    - F008
- title: Two and a half hours
  part: 2
  quote_after: 1
  paras:
  - text: OpenAI's own timeline puts the agent's DNS call that received an external response at 9:50:23
      a.m. The monitoring system raised a P0 alert at 10:02:11. A human reviewer acknowledged it at 10:05:06.
      The run was killed at 12:34:30 p.m.
    rows:
    - F020
    - F021
    - F022
    - F023
  - text: OpenAI says the run was stopped manually two and a half hours later, once it had resolved confusion
      over whether the run should have been stopped.
    rows:
    - F035
  - text: OpenAI says its review found other cases of external DNS access that had not been flagged at
      the expected severity. Separately, it says, an infrastructure detector for unusual DNS activity
      had excluded the affected environment, although that activity was logged.
    rows:
    - F036
    - F037
  - text: The exhibit sets OpenAI's 18 August rule beside its 20 September timeline. The record does not
      say whether a P0 alert is the rule's highest-priority alert, or whether the rule applied to this
      run, so the two are shown side by side, not as a breach.
    rows:
    - F072
    - F073
