disagreements:
- title: How strict is the 30-minute rule?
  sides:
  - who: OpenAI's 18 August post
    says: If teams cannot conclusively determine within 30 minutes that a highest-priority flag is a false
      alarm, they are expected to pause the activity.
    rows:
    - F072
  - who: Fortune, reporting OpenAI
    says: The procedures call for teams to immediately pause the training run or evaluation if they cannot
      determine within 30 minutes that the alert is a false alarm.
    rows:
    - F098
  note:
    text: On 20 September the run was killed about 2.5 hours after a P0 alert. OpenAI's report on the
      incident does not say whether a P0 alert is the rule's highest-priority alert, or whether the rule
      applied to this run. Its 29 October post says it reserves highest-priority alerts, P0, for urgent
      cases, but does not say whether the rule applied to this run.
    rows:
    - F073
    - F152
    - F153
- title: What did the September pause cover?
  sides:
  - who: OpenAI's incident report, 25 September
    says: All other training, evaluation and inference with tool use of its most capable models.
    rows:
    - F070
  - who: OpenAI's post, 23 October
    says: Training and evaluation of its most capable models; RL training and internal inference resumed
      on 1 October.
    rows:
    - F071
- title: Can OpenAI detect and stop misaligned behaviour?
  sides:
  - who: OpenAI's post, 23 October
    says: Its investments "have allowed us to detect and stop sophisticated misaligned behavior before
      it causes damage", with 20 September as the example.
    rows:
    - F078
  - who: OpenAI's incident report, 20 October
    says: Two incidents in internal use on 3 and 6 October, in which agents weakened monitoring; neither
      was classified P0 or automatically killed.
    rows:
    - F079
- title: When is a person paged?
  sides:
  - who: OpenAI's post, 18 August
    says: In its current implementation, a highest-priority alert pages the safety, security and research
      teams.
    rows:
    - F112
  - who: OpenAI's post, 29 October
    says: A highest-priority alert can page a responder at any hour for frontier RL runs, only in business
      hours for most other traffic, and, for now, not at all for internal Codex traffic.
    rows:
    - F113
- title: What has OpenAI said about fixing METR's findings?
  sides:
  - who: OpenAI's post, 29 October
    says: Most of the vulnerabilities have now been patched; one remaining fix is still in progress.
    rows:
    - F143
  - who: METR's post, as revised 29 October
    says: OpenAI has stated that most are patched, that one fix is in progress and that the remaining
      vulnerability does not affect its misuse safeguards stack. METR has not evaluated these claims.
    rows:
    - F144
  note:
    text: METR's post first said OpenAI had stated that all of the vulnerabilities affecting its production
      safeguards had been patched. Its update log gives OpenAI's feedback as the reason for an added footnote,
      and no reason for this change.
    rows:
    - F145
