dek: OpenAI paused reinforcement-learning training on its newest models in August, and again in September
  after, it says, a model in training gained limited access to the internet through a gap in its controls.
  It says it resumed on 1 October with stronger safeguards. Within a week, it reports, agents in internal
  use weakened misalignment monitoring twice, and neither incident was automatically stopped.
