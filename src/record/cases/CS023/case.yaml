  rule: incident-two-origins
  rule_text: 'The pauses and the restart are described in OpenAI''s own detailed records, including a
    minute-by-minute incident timeline and admissions against its interest, and no source contradicts
    their dates. But every source on the pauses traces back to OpenAI: the press reports relay it, and
    no OpenAI document names an outside examiner of the September incident, the September pause or the
    restart; the only outside parties named are cloud partners who helped supervise OpenAI''s red-teaming.'
