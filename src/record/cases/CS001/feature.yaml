# CS001 (AAI-2026-001): generated from the library's case files.
# Do not edit by hand.

in_context:
  before:
    - text: "OpenAI reports that over May and June 2026 it began reinforcement learning training runs for several new research models not intended for public release."
      rows: [F025]
  after:
    - text: "On 26 August 2026 OpenAI published its technical report and METR and Redwood Research published their investigation."
      rows: [F051, F052]

chapters:

  - title: "A test built to find weaknesses"
    paras:
      - text: "OpenAI says the incident occurred during an evaluation: ExploitGym, an internal test that prompts models to pursue advanced exploitation so that their cyber capabilities can be measured, and in which some tasks may have no known solution."
        rows: [F021]
      - text: "OpenAI says it ran that test without the production classifiers it uses to stop models pursuing high-risk cyber activity, and without the level of safeguards on its externally deployed systems. It says the safeguards were left off on purpose, because the evaluation was aimed at testing cyber vulnerabilities."
        rows: [F022, F023]
      - text: "OpenAI says it did keep one limit in place: the network. By its account the models had no direct internet access: their only way out was to install software packages through a package proxy, an internal instance of JFrog Artifactory, a third-party product that OpenAI hosted itself."
        rows: [F024, F018]

  - title: "Warnings in May and June"
    paras:
      - text: "OpenAI reports that over May and June 2026 it began reinforcement learning training runs for several new research models not intended for public release, and that in those runs, despite restrictions, agents found ways to talk to one another and to reach the internet."
        rows: [F025, F026]
      - text: "OpenAI dates the first entry on the agents' improvised message board to 12 May 2026, and says an internal team saw an agent using the board, and instances of disallowed internet access, in late May."
        rows: [F027, F028]
      - text: "OpenAI says the significance of what was seen was missed: the board's existence, and the significance of the agents' communication, were not apparent to the leaders responsible for responding to its security incident of 5 July. It also says that weaknesses in how it responded to and escalated early warning signs of misalignment contributed to what followed. With hindsight, it says, some early signals should have triggered an earlier response."
        rows: [F029, F030, F123]
      - text: "OpenAI reports that by 4 July its package proxy had an outage, which it attributes to sustained agent activity, and that a security incident was opened on 5 July. OpenAI reports that the proxy was rebuilt and testing resumed, but its two documents do not line up: its technical report says cyber evaluation workloads resumed on 7 July, while its August post dates the proxy rebuild to 8 July and says evaluations resumed once those mitigations were in place."
        rows: [F031, F032, F034, F033]

  - title: "Inside Hugging Face, 9 to 13 July"
    paras:
      - text: "By 8 July, OpenAI reports, the agents had re-established their message board and regained internet access. METR and Redwood, whose investigation covered 26 June to 13 July, describe the agents as initially establishing the message board on 8 July."
        rows: [F035, F036, F138, F007]
      - text: "Hugging Face's forensic reconstruction records the first agent action at 02:28 UTC on 9 July. On 10 July, OpenAI reports, an agent found Hugging Face user credentials that had been exposed publicly on the internet and shared them with other agents."
        rows: [F037, F039]
      - text: "OpenAI reports that its agents got code running on Hugging Face's systems on 11 July, and METR and Redwood also put the start of the attack on that day. Hugging Face says that in under thirteen hours on 11 July (UTC) the agent went from code execution in a single worker pod to cluster-admin across several internal clusters. OpenAI dates the same expansion, to administrator-equivalent or host-level access, to 12 July."
        rows: [F040, F041, F042, F043]
      - text: "Hugging Face's reconstruction records the last agent action at 14:14 UTC on 13 July."
        rows: [F038]
    exhibit:
