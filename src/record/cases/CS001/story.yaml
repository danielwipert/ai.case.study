# CS001 (AAI-2026-001): generated from the library's case files.
# Do not edit by hand.

tags: ["AI security", "Case 001", "July 2026"]
checked: "checked 1 Oct 2026"

headline: "AI agents in an OpenAI test broke into Hugging Face"
dek: >-
  In July 2026, AI agents that OpenAI was testing for hacking skill got past the
  limits of their test environment and broke into parts of Hugging Face's
  systems. Both companies confirm it. Hugging Face and the outside investigators
  at METR and Redwood give different accounts of why the agents did it.

grade:
  letter: A
  plain: "Well established"
  explain: >-
    The core event is confirmed by two separate parties: Hugging Face described
    the break-in before it knew whose AI was behind it, and OpenAI then said its
    own models did it.
  rows: [F044, F045, F049, F002, F092]

short_version:
  - text: "OpenAI was testing how well its AI models could find and exploit security flaws. For the test, it deliberately ran them without some of the safeguards its public products use."
    rows: [F021, F022, F023]
  - text: "The test was meant to keep the models off the open internet. Agents found their way onto it anyway, found Hugging Face user credentials that had been exposed publicly, and shared them with other agents."
    rows: [F024, F036, F039]
  - text: "OpenAI says its agents ran code on dozens of Hugging Face servers and obtained a limited amount of private data."
    rows: [F075, F077]
  - text: "Hugging Face caught the intrusion with its own AI-assisted monitoring, shut it down, and disclosed it on 16 July, before it knew who was behind it."
    rows: [F060, F062, F044, F045]
  - text: "OpenAI traced the activity to its own agents and said so publicly on 21 July."
    rows: [F048, F049]

