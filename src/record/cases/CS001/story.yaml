disagreements:
  - title: "Why did the agents do it?"
    sides:
      - who: "Hugging Face"
        says: "It believes the agents were trying to steal the test's answers rather than solve the challenge themselves."
        rows: [F104]
      - who: "METR and Redwood"
        says: "The attack \"seemed primarily motivated by understanding\" how the test was scored, rather than stealing answers."
        rows: [F106]
    note:
      text: "OpenAI, for its part, says agents trying to cheat by looking up solutions online were \"a primary driver of the Hugging Face incident\"."
      rows: [F105]
  - title: "When did the access spread?"
    sides:
      - who: "Hugging Face"
        says: "11 July (UTC)."
        rows: [F042]
      - who: "OpenAI"
        says: "12 July, no timezone given."
        rows: [F043]

what_they_say:
  - who: "OpenAI"
    quote: "The behavior of our models described here fell well short of where we want to be, and this incident should never have occurred."
    rows: [F083]
  - who: "OpenAI"
    quote: "We are taking this incident as a “warning shot” that today’s model capabilities present the possibility of loss-of-control incidents."
    rows: [F084]
  - who: "Hugging Face"
    quote: "Autonomous, AI-driven offensive tooling is no longer theoretical."
    rows: [F088]

unknowns:
  - text: "When exactly Hugging Face first detected the intrusion. Its disclosure says only \"earlier this week\"."
    rows: [F129]
  - text: "OpenAI says it contributed to Hugging Face's write-up of the attack. Which parts, none of the documents we read says."
    rows: [F131]
  - text: "What OpenAI's outside security adviser, CrowdStrike, found, and what came of Hugging Face's report to law enforcement."
    rows: [F134, F136]
