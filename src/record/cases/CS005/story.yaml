tags: ["AI hiring", "Case 005", "May 2026"]
checked: "checked 3 Oct 2026"

headline: "A court let Workday withhold its own AI bias-testing data from the people suing it"
dek: >-
  In May 2026, a federal judge ruled that Workday did not have to hand over
  its own bias-testing data to the people suing it. The court's reason:
  Workday's lawyers curated the data and used the results to give legal advice. The same order made Workday produce
  its EEO-1 and OFCCP records. The lawsuit's discrimination claims are untried.
dek_rows: [F001, F003, F006, F004]

grade:
  letter: B
  plain: "Well supported"
  explain: >-
    What the court decided comes from the court's own order. We read a public
    copy of it and have not matched that copy against the court's official record, so what the court decided
    rests on one copy of one document.
  rows: [F001, F003, F006]

short_version:
  - text: "The plaintiffs are suing Workday. The court describes their claim as an AI screening system that is more likely to reject applicants who are African American, have disabilities, or are over forty. The claims have not been tried."
    rows: [F001, F018]
  - text: "The plaintiffs asked the court to make Workday hand over its bias-testing data and its customers' applicant data. The court said no to both."
    rows: [F019, F003]
  - text: "The court's reason for the bias-testing data: attorney-client privilege applies, because Workday's lawyers curated the data and used the results to give legal advice. The order says Workday represented that its lawyers curated the data and that the testing's purpose was legal advice."
    rows: [F006, F007]
  - text: "On bias-testing data, the order says it addresses only the data Workday claims is privileged. On customers' data, the court said it could not order production on the record before it."
    rows: [F011, F013]
  - text: "The court did order Workday to produce its EEO-1 and OFCCP records, saying Workday uses the same AI tools as its customers."
    rows: [F004, F015]

