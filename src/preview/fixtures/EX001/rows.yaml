# FICTIONAL EXAMPLE FOR LAYOUT TESTING. Invented rows about an invented trial.
#
# A row is the library's statement: one plain sentence, a kind (spec 6.5),
# and links to claims (spec 5.3). Support, conflict, origins and examiners are
# NEVER typed here. src/preview/lib/record.mjs computes them from the links,
# the claims and the docket (spec 6.2).
#
# Check marks: `by` is the initials of a fictional editor ("ED"). The
# fingerprint binds the row text and the quote together (decision 26); if
# either changes, the mark reads as void.

