name: Deploy to GitHub Pages

# Merging a pull request pushes to main, so the push trigger already covers
# merges. A pull_request_target [closed] trigger was previously added as a
# second path to the same deploy; because both fired on the same commit and
# shared the "pages" concurrency group, one of the two was cancelled at
# random on every merge. workflow_dispatch remains the manual fallback if a
# merge ever lands without firing push, such as one made with GITHUB_TOKEN.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
